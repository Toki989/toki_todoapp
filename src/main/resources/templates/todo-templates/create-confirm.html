<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>テンプレート登録確認</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="container"><h1 class="page-title">テンプレート登録確認</h1>
<p><span class="form-label">テンプレート名</span><span class="confirm-value" th:text="${todoTemplateForm.name}"></span></p>
<div th:replace="~{todo-templates/fragments :: confirmItems(${todoTemplateForm.items})}"></div>
<form action="/todo-templates" method="post" th:object="${todoTemplateForm}">
 <input type="hidden" th:field="*{name}"><div th:each="item,status : *{items}"><input type="hidden" th:field="*{items[__${status.index}__].title}"><input type="hidden" th:field="*{items[__${status.index}__].detail}"><input type="hidden" th:field="*{items[__${status.index}__].category}"><input type="hidden" th:field="*{items[__${status.index}__].priority}"><input type="hidden" th:field="*{items[__${status.index}__].dueDate}"></div>
 <div class="confirm-actions"><button class="btn" type="submit">登録する</button><button class="btn sub" type="submit" formaction="/todo-templates/new">書き直す</button></div>
</form></div></body></html>
