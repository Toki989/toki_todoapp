<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>テンプレート適用確認</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="container"><h1 class="page-title">テンプレート適用確認</h1><p>以下のToDoを一括作成します。</p><h2 th:text="${template.name}"></h2><div th:replace="~{todo-templates/fragments :: confirmItems(${template.items})}"></div>
<form th:action="@{/todo-templates/{id}/apply(id=${template.id})}" method="post"><div class="confirm-actions"><button class="btn" type="submit" th:disabled="${#lists.isEmpty(template.items)}">適用する</button><a class="btn sub" th:href="@{/todo-templates/{id}/apply(id=${template.id})}">戻る</a></div></form>
</div></body></html>
