<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>テンプレート削除確認</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="container"><h1 class="page-title">テンプレート削除確認</h1><p>次のテンプレートを削除します。</p><h2 th:text="${template.name}"></h2><div th:replace="~{todo-templates/fragments :: confirmItems(${template.items})}"></div>
<form th:action="@{/todo-templates/{id}/delete(id=${template.id})}" method="post"><div class="confirm-actions"><button class="btn" type="submit">削除する</button><a class="btn sub" href="/todo-templates">やめる</a></div></form>
</div></body></html>
