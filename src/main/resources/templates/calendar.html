<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">カレンダー</h1>

        <nav class="calendar-navigation" aria-label="月の移動">
            <a class="link" th:href="@{/calendar(year=${previousMonth.year},month=${previousMonth.monthValue})}">前の月</a>
            <h2 class="calendar-heading" th:text="|${year}年${month}月|">2026年4月</h2>
            <a class="link" th:href="@{/calendar(year=${nextMonth.year},month=${nextMonth.monthValue})}">次の月</a>
        </nav>

        <p class="calendar-legend"><span class="holiday-swatch" aria-hidden="true"></span>祝日</p>
        <p class="calendar-status" aria-live="polite"></p>

        <div class="calendar-frame">
            <table class="calendar-table" th:attr="data-from=${firstDay},data-to=${lastDay}">
                <thead>
                    <tr>
                        <th scope="col">日</th>
                        <th scope="col">月</th>
                        <th scope="col">火</th>
                        <th scope="col">水</th>
                        <th scope="col">木</th>
                        <th scope="col">金</th>
                        <th scope="col">土</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="week : ${weeks}">
                        <th:block th:each="date : ${week}">
                            <td th:if="${date != null}" th:attr="data-date=${date}">
                                <span class="calendar-day" th:text="${date.dayOfMonth}"></span>
                            </td>
                            <td class="calendar-empty" th:unless="${date != null}"></td>
                        </th:block>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function showTodosOnCalendar() {
            const todoCalendar = document.querySelector('.calendar-table');
            const from = todoCalendar.dataset.from;
            const to = todoCalendar.dataset.to;
            const [todoResponse, holidayResponse] = await Promise.all([
                fetch(`/api/todos?from=${from}&to=${to}`),
                fetch(`/api/holidays?from=${from}&to=${to}`)
            ]);
            const todos = await todoResponse.json();
            const holidays = await holidayResponse.json();
            const now = new Date();
            const today = [
                now.getFullYear(),
                String(now.getMonth() + 1).padStart(2, '0'),
                String(now.getDate()).padStart(2, '0')
            ].join('-');

            const datedCells = todoCalendar.querySelectorAll('[data-date]');
            datedCells.forEach(cell => {
                const date = cell.dataset.date;
                const dayOfWeek = new Date(`${date}T00:00:00`).getDay();

                if (dayOfWeek === 6) {
                    cell.style.backgroundColor = '#eaf4ff';
                } else if (dayOfWeek === 0) {
                    cell.style.backgroundColor = '#ffecec';
                }

                if (holidays[date] !== undefined) {
                    cell.style.backgroundColor = '#fff4cc';
                    cell.title = holidays[date];
                }

                const todosForDate = todos.filter(todo => todo.dueDate === date);
                todosForDate
                    .slice(0, 3)
                    .forEach(todo => {
                        const todoName = document.createElement('div');
                        todoName.textContent = todo.title;
                        todoName.style.color = '#334155';
                        if (todo.dueDate < today && todo.completed !== true) {
                            todoName.style.color = 'red';
                        }
                        cell.appendChild(todoName);
                    });

                if (todosForDate.length > 3) {
                    const remainingCount = document.createElement('div');
                    remainingCount.textContent = `ほか ${todosForDate.length - 3}件`;
                    cell.appendChild(remainingCount);
                }
            });

            if (holidayResponse.headers.has('X-Holidays-Unavailable')) {
                document.querySelector('.calendar-status').textContent = '祝日を取れませんでした';
            }
        }

        showTodosOnCalendar();
    </script>
</body>
</html>
