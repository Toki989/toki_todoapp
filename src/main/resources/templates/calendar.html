<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">カレンダー</h1>

        <nav class="calendar-navigation" aria-label="表示の切り替え">
            <a class="btn sub" th:href="@{/calendar(year=${firstDay.year},month=${firstDay.monthValue},view=month)}"
               th:attr="aria-current=${view == 'month' ? 'page' : null}">月表示</a>
            <a class="btn sub" th:href="@{/calendar(view=week,date=${firstDay})}"
               th:attr="aria-current=${view == 'week' ? 'page' : null}">週表示</a>
        </nav>

        <nav class="calendar-navigation" th:if="${view == 'month'}" aria-label="月の移動">
            <a class="link" th:href="@{/calendar(year=${previousMonth.year},month=${previousMonth.monthValue},view=month)}">前の月</a>
            <h2 class="calendar-heading" th:text="|${year}年${month}月|">2026年4月</h2>
            <a class="link" th:href="@{/calendar(year=${nextMonth.year},month=${nextMonth.monthValue},view=month)}">次の月</a>
        </nav>

        <nav class="calendar-navigation" th:if="${view == 'week'}" aria-label="週の移動">
            <a class="link" th:href="@{/calendar(view=week,date=${previousWeek})}">前の週</a>
            <h2 class="calendar-heading" th:text="|${firstDay.year}年${firstDay.monthValue}月${firstDay.dayOfMonth}日〜${lastDay.year}年${lastDay.monthValue}月${lastDay.dayOfMonth}日|">2026年4月5日〜2026年4月11日</h2>
            <a class="link" th:href="@{/calendar(view=week,date=${nextWeek})}">次の週</a>
        </nav>

        <p class="calendar-legend"><span class="holiday-swatch" aria-hidden="true"></span>祝日</p>
        <p class="calendar-status" aria-live="polite"></p>

        <div class="calendar-frame">
            <table class="calendar-table" th:attr="data-from=${firstDay},data-to=${lastDay},data-view=${view}">
                <thead>
                    <tr>
                        <th scope="col">日</th>
                        <th scope="col">月</th>
                        <th scope="col">火</th>
                        <th scope="col">水</th>
                        <th scope="col">木</th>
                        <th scope="col">金</th>
                        <th scope="col">土</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="week : ${weeks}">
                        <th:block th:each="date : ${week}">
                            <td th:if="${date != null}" th:attr="data-date=${date}">
                                <span class="calendar-day" th:text="${date.dayOfMonth}"></span>
                            </td>
                            <td class="calendar-empty" th:unless="${date != null}"></td>
                        </th:block>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function showTodosOnCalendar() {
            const todoCalendar = document.querySelector('.calendar-table');
            const from = todoCalendar.dataset.from;
            const to = todoCalendar.dataset.to;
            const weekView = todoCalendar.dataset.view === 'week';
            const emptyWeather = { daily: { time: [] } };
            const [todoResponse, holidayResponse, weatherResult] = await Promise.all([
                fetch(`/api/todos?from=${from}&to=${to}`),
                fetch(`/api/holidays?from=${from}&to=${to}`),
                fetch('/api/weather')
                    .then(response => response.ok
                        ? response.json().then(weather => ({ weather, unavailable: response.headers.has('X-Weather-Unavailable') }))
                        : { weather: emptyWeather, unavailable: true })
                    .catch(() => ({ weather: emptyWeather, unavailable: true }))
            ]);
            const todos = await todoResponse.json();
            const holidays = await holidayResponse.json();
            const weatherDaily = weatherResult.weather.daily ?? emptyWeather.daily;
            const weatherByDate = new Map((weatherDaily.time ?? []).map((date, index) => [date, {
                code: weatherDaily.weather_code?.[index],
                max: weatherDaily.temperature_2m_max?.[index],
                min: weatherDaily.temperature_2m_min?.[index],
                precipitation: weatherDaily.precipitation_probability_max?.[index]
            }]));
            const now = new Date();
            const today = [
                now.getFullYear(),
                String(now.getMonth() + 1).padStart(2, '0'),
                String(now.getDate()).padStart(2, '0')
            ].join('-');

            const datedCells = todoCalendar.querySelectorAll('[data-date]');
            datedCells.forEach(cell => {
                const date = cell.dataset.date;
                const dayOfWeek = new Date(`${date}T00:00:00`).getDay();

                if (dayOfWeek === 6) {
                    cell.classList.add('calendar-saturday');
                } else if (dayOfWeek === 0) {
                    cell.classList.add('calendar-sunday');
                }

                if (holidays[date] !== undefined) {
                    cell.classList.add('calendar-holiday');
                    cell.title = holidays[date];
                }

                const weather = weatherByDate.get(date);
                if (weather !== undefined) {
                    const weatherText = document.createElement('div');
                    weatherText.className = 'calendar-weather';
                    weatherText.textContent = `${weatherName(weather.code)} ${weather.max}℃ / ${weather.min}℃ 降水${weather.precipitation}%`;
                    cell.appendChild(weatherText);
                }

                const todosForDate = todos.filter(todo => todo.dueDate === date);
                const visibleTodos = weekView ? todosForDate : todosForDate.slice(0, 3);
                visibleTodos
                    .forEach(todo => {
                        const todoName = document.createElement('div');
                        todoName.textContent = todo.title;
                        todoName.className = 'calendar-todo';
                        if (todo.dueDate < today && todo.completed !== true) {
                            todoName.classList.add('calendar-todo-overdue');
                        }
                        cell.appendChild(todoName);
                    });

                if (!weekView && todosForDate.length > 3) {
                    const remainingCount = document.createElement('div');
                    remainingCount.textContent = `ほか ${todosForDate.length - 3}件`;
                    cell.appendChild(remainingCount);
                }
            });

            const unavailableMessages = [];
            if (holidayResponse.headers.has('X-Holidays-Unavailable')) {
                unavailableMessages.push('祝日を取れませんでした');
            }
            if (weatherResult.unavailable) {
                unavailableMessages.push('天気を取れませんでした');
            }
            document.querySelector('.calendar-status').textContent = unavailableMessages.join(' ');
        }

        function weatherName(code) {
            if (code === 0) return '晴れ';
            if (code <= 3) return 'くもり';
            if (code === 45 || code === 48) return '霧';
            if (code <= 57) return '霧雨';
            if (code <= 67) return '雨';
            if (code <= 77) return '雪';
            if (code <= 82) return 'にわか雨';
            if (code <= 86) return 'にわか雪';
            if (code >= 95) return '雷雨';
            return '天気不明';
        }

        showTodosOnCalendar();
    </script>
</body>
</html>
