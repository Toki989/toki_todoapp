<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title" th:text="${trash} ? '消したもの' : 'やること一覧'">やること一覧</h1>

        <p class="flash" th:if="${message != null}" th:text="${message}"></p>

        <p th:if="${!trash}"><a class="link" href="/todos/new">新規登録</a></p>
        <p><a class="link" th:href="${trash} ? '/todos' : '/todos?trash=1'"
              th:text="${trash} ? '一覧に戻る' : '消したものを見る'"></a></p>

        <form class="search-bar" method="get" action="/todos">
            <label>
                やること
                <input type="text" name="keyword" th:value="${keyword}">
            </label>
            <label>
                ジャンル
                <select name="category">
                    <option value="" th:selected="${category == ''}">すべて</option>
                    <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                    <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                    <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                    <option value="資格" th:selected="${category == '資格'}">資格</option>
                    <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
                </select>
            </label>
            <label th:if="${!trash}">
                <input type="checkbox" name="showCompleted" value="true"
                       th:checked="${showCompleted}">
                完了したものも表示する
            </label>
            <input type="hidden" name="order" th:value="${order}">
            <input th:if="${trash}" type="hidden" name="trash" value="1">
            <button class="btn" type="submit">絞り込む</button>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='asc',showCompleted=${showCompleted},trash=${trash ? 1 : null},page=${currentPage})}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='desc',showCompleted=${showCompleted},trash=${trash ? 1 : null},page=${currentPage})}">期限が遠い順</a>
            <a class="btn" download="todos.csv"
               th:href="@{/api/todos.csv(keyword=${keyword},category=${category},order=${order},showCompleted=${showCompleted},trash=${trash ? 1 : 0})}">CSVで書き出す</a>
        </form>

        <table class="todo-table" th:if="${!#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th th:if="${!trash}">印</th>
                    <th>やること</th>
                    <th>メモ</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}"
                    th:classappend="${todo.dueDate != null and todo.dueDate.isBefore(today) and todo.completed != true} ? 'overdue'">
                    <td th:if="${!trash}">
                        <form th:action="@{/todos/{id}/pin(id=${todo.id})}" method="post">
                            <input type="hidden" name="keyword" th:value="${keyword}">
                            <input type="hidden" name="category" th:value="${category}">
                            <input type="hidden" name="order" th:value="${order}">
                            <input type="hidden" name="showCompleted" th:value="${showCompleted}">
                            <input type="hidden" name="page" th:value="${currentPage}">
                            <button class="btn" type="submit"
                                    th:text="${todo.pinned} ? '★' : '☆'"
                                    th:attr="aria-label=${todo.pinned} ? '印を外す' : '印を付ける'"></button>
                        </form>
                    </td>
                    <td th:text="${todo.title}"></td>
                    <td th:text="${todo.detail}"></td>
                    <td th:text="${todo.category}"></td>
                    <td>
                        <span class="priority-mark" th:if="${todo.priority == 1}" aria-label="最優先">★</span>
                        <span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}"></span>
                    </td>
                    <td th:text="${todo.dueDate}"></td>
                    <td th:text="${todo.completed ? '完了（' + #temporals.format(todo.completedAt, 'yyyy-MM-dd') + '）' : '未完了'}"></td>
                    <td th:if="${!trash}"><a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a> <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a></td>
                    <td th:if="${trash}">
                        <form th:action="@{/todos/{id}/restore(id=${todo.id})}" method="post">
                            <button class="btn" type="submit">戻す</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <nav class="pagination" th:if="${totalPages > 1}" aria-label="ページ移動">
            <a class="page-number"
               th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
               th:classappend="${pageNumber == currentPage} ? 'current'"
               th:href="@{/todos(keyword=${keyword},category=${category},order=${order},showCompleted=${showCompleted},trash=${trash ? 1 : null},page=${pageNumber})}"
               th:text="${pageNumber}"
               th:attr="aria-current=${pageNumber == currentPage ? 'page' : null}"></a>
        </nav>

        <p th:if="${#lists.isEmpty(todos)}"
           th:text="${trash} ? '消したものはありません' : 'まだ1件も登録されていません'"></p>
    </div>
</body>
</html>
