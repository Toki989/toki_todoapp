<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること登録確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">やること登録確認</h1>

        <div class="form-row">
            <span class="form-label">やること</span>
            <p class="confirm-value" th:text="${#strings.isEmpty(todo.title) ? '（入力なし）' : todo.title}"></p>
        </div>

        <div class="form-row">
            <span class="form-label">メモ</span>
            <p class="confirm-value" th:text="${#strings.isEmpty(todo.detail) ? '（入力なし）' : todo.detail}"></p>
        </div>

        <div class="form-row">
            <span class="form-label">ジャンル</span>
            <p class="confirm-value" th:text="${#strings.isEmpty(todo.category) ? '（入力なし）' : todo.category}"></p>
        </div>

        <div class="form-row">
            <span class="form-label">優先度</span>
            <p class="confirm-value" th:text="${todo.priority == null ? '（入力なし）' : (todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低'))}"></p>
        </div>

        <div class="form-row">
            <span class="form-label">期限</span>
            <p class="confirm-value" th:text="${todo.dueDate == null ? '（入力なし）' : todo.dueDate}"></p>
        </div>

        <form action="/todos" method="post" th:object="${todo}">
            <input type="hidden" th:field="*{title}">
            <input type="hidden" th:field="*{detail}">
            <input type="hidden" th:field="*{category}">
            <input type="hidden" th:field="*{priority}">
            <input type="hidden" th:field="*{dueDate}">

            <div class="confirm-actions">
                <button class="btn" type="submit">登録する</button>
                <button class="btn sub" type="submit" formaction="/todos/new">書き直す</button>
            </div>
        </form>
    </div>
</body>
</html>
