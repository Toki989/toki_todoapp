<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること削除確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">やること削除確認</h1>

        <div class="form-row">
            <span class="form-label">やること</span>
            <p class="confirm-value" th:text="${todo.title}"></p>
        </div>

        <div class="form-row">
            <span class="form-label">ジャンル</span>
            <p class="confirm-value" th:text="${todo.category}"></p>
        </div>

        <div class="form-row">
            <span class="form-label">期限</span>
            <p class="confirm-value" th:text="${todo.dueDate}"></p>
        </div>

        <div class="confirm-actions">
            <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post">
                <button class="btn" type="submit">消す</button>
            </form>
            <a class="btn sub" href="/todos">やめる</a>
        </div>
    </div>
</body>
</html>
